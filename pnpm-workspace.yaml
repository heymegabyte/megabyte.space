packages:
  - cloudflare-os/packages/workshop-shared
  - cloudflare-os/packages/error-reporting
  - cloudflare-os/scripts
  - packages/*

# The fork packages above resolve their `catalog:` specifiers here. Keep their runtime
# dependencies aligned with the fork, which has a separate frozen install.
#
# Check both locked Cap'n Web versions when bumping the gitlink. Drift is silent:
# the starter and the submodule install separately, so a different resolution can give the
# tree two copies, and a stub minted by one is unserialisable by the other's session
# (`TypeError: Cannot serialize value: [object RpcStub]`). A deduped dev machine hides it; the
# split installs in CI and on a fresh checkout do not. See
# cloudflare-os/docs/integration-testing.md.
catalog:
  '@cloudflare/vitest-pool-workers': ^0.20.2
  '@cloudflare/workers-types': ^5.20261113.1
  capnweb: ^0.13.1
  # Exact: pinned in lockstep with capnweb (declared as a >=0.7.0 peer)
  capnweb-validate: 0.3.2
  # Exact: TypeScript 7 (tsgo). The submodule's tsconfig sets `singleThreaded`, which TS 5.9
  # rejects outright. The shared build tooling uses the JS compiler API through the alias.
  typescript: 7.0.2
  typescript6: npm:typescript@6.0.3
  # Exact, not ranged: the transform has to stay on esbuild. Oxc does not lower the Stage-3
  # decorators capnweb-validate's `@validateRpc()` relies on (cloudflare/workers-sdk#12626).
  vite: 7.3.6
  vite-plus: ^1.5.1
  # The wrapper's Cloudflare test pool still requires Vitest 4.
  vitest: ^4.1.10
  wrangler: ^4.119.0
  zod: ^4.6.7

overrides:
  # Vitest peers can resolve vite@latest, so the version is pinned rather than ranged. Points at the
  # catalog so this and the manifests can't disagree. Match semver requests so Vite+'s aliased
  # core is preserved, as in the fork workspace.
  vite@*: "catalog:"
  # Arrives as an optional vite/vitest peer resolved to `latest`; pinned to the same release the
  # submodule pins so the two installs agree.
  '@types/node': 26.1.0

allowBuilds:
  '@google/genai': true
  core-js-pure: true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260929.1'
